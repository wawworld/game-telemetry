name: Build Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - '001-game-telemetry'  # 현재 브랜치 추가
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: List Python packages
      run: pip list
    
    - name: Debug - Show directory structure
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        dir
        echo "src directory:"
        dir src
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name=GameTelemetry --paths=src --add-data="configs;configs" --add-data="reference_images;reference_images" --hidden-import=pynput.keyboard --hidden-import=pynput.mouse --hidden-import=PIL --hidden-import=cv2 --hidden-import=yaml --hidden-import=psutil --collect-submodules=pynput src/cli/main.py
    
    - name: Verify build
      run: |
        dir dist
    
    - name: Test EXE
      run: |
        dist\GameTelemetry.exe --help
      continue-on-error: true
    
    - name: Create package
      run: |
        mkdir GameTelemetry-Windows
        copy dist\GameTelemetry.exe GameTelemetry-Windows\
        xcopy /E /I configs GameTelemetry-Windows\configs
        xcopy /E /I reference_images GameTelemetry-Windows\reference_images
        @"
        Game Telemetry System
        ====================
        
        Usage:
          GameTelemetry.exe start --config configs\test_roi.yaml
          GameTelemetry.exe start --config configs\test_roi.yaml --participant-id user123
          GameTelemetry.exe --help
        
        Requirements:
          - Windows 10 or later
          - No Python installation required
        
        For more information:
          https://github.com/wawworld/game-telemetry
        "@ | Out-File -FilePath GameTelemetry-Windows\README.txt -Encoding UTF8
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameTelemetry-Windows
        path: GameTelemetry-Windows/
    
    - name: Zip package
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Compress-Archive -Path GameTelemetry-Windows -DestinationPath GameTelemetry-Windows.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          GameTelemetry-Windows.zip
          dist/GameTelemetry.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: List Python packages
      run: pip list
    
    - name: Debug - Show directory structure
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "src directory:"
        ls -la src
    
    - name: Build macOS App
      run: |
        pyinstaller --onefile --console --name=GameTelemetry --paths=src --add-data="configs:configs" --add-data="reference_images:reference_images" --hidden-import=pynput.keyboard --hidden-import=pynput.mouse --hidden-import=PIL --hidden-import=cv2 --hidden-import=yaml --hidden-import=psutil --collect-submodules=pynput src/cli/main.py
    
    - name: Verify build
      run: |
        ls -la dist/
    
    - name: Test App
      run: |
        dist/GameTelemetry --help
      continue-on-error: true
    
    - name: Create package
      run: |
        mkdir -p GameTelemetry-macOS
        cp dist/GameTelemetry GameTelemetry-macOS/
        chmod +x GameTelemetry-macOS/GameTelemetry
        cp -r configs GameTelemetry-macOS/
        cp -r reference_images GameTelemetry-macOS/
        cat > GameTelemetry-macOS/README.txt << 'EOF'
        Game Telemetry System
        ====================
        
        Usage:
          ./GameTelemetry start --config configs/test_roi.yaml
          ./GameTelemetry start --config configs/test_roi.yaml --participant-id user123
          ./GameTelemetry --help
        
        Requirements:
          - macOS 11 or later
          - No Python installation required
        
        Note: On first run, you may need to allow the app in System Preferences > Security & Privacy
        
        For more information:
          https://github.com/wawworld/game-telemetry
        EOF
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameTelemetry-macOS
        path: GameTelemetry-macOS/
    
    - name: Create tarball
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        tar -czf GameTelemetry-macOS.tar.gz GameTelemetry-macOS
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: GameTelemetry-macOS.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
